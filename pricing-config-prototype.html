<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing Configs — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* DS By Claimsforce — pulled from Figma file S4z87xUFoQSx3KE1XOa6Zr (01 - Basics) */

  /* Neutrals */
  --gray-0:#FCFCFC;
  --gray-050:#F9F9FA;
  --gray-100:#F1F3F6;
  --gray-200:#E2E5EB;
  --gray-300:#D0D4DD;
  --gray-400:#9399A7;
  --gray-500:#7A7F8B;
  --gray-600:#585D68;

  /* Text */
  --dark-text-high:#222429;
  --dark-text-medium:#353940;
  --dark-text-light:#6B6C70;
  --dark-text-off:#BCBEC0;

  /* Brand (Violet) */
  --violet-100:#EDF1FF;
  --violet-200:#DEE2FF;
  --violet-300:#C2CAFF;
  --violet-400:#7F7AFF;
  --violet-500:#7055FA;
  --violet-600:#4A32A8;

  /* Semantic */
  --orange-100:#FFF1E3;
  --orange-200:#FFE3C6;
  --orange-300:#FFCBA6;
  --orange-400:#FFA673;
  --orange-500:#F28852;
  --orange-600:#CB5418;

  --red-100:#FFEBEF;
  --red-200:#FAD2DE;
  --red-400:#DE3131;
  --red-500:#C21616;
  --red-600:#9E020A;

  --green-100:#E4F7E7;
  --green-200:#B8ECC9;
  --green-400:#32B053;
  --green-600:#06672C;

  --blue-100:#D6EFFF;
  --blue-200:#AFDCFA;
  --blue-400:#0073D8;
  --blue-500:#005DBF;
  --blue-600:#0047A0;

  /* App aliases */
  --paper:var(--gray-050);
  --paper-raised:#FFFFFF;
  --ink:var(--dark-text-high);
  --ink-soft:var(--dark-text-medium);
  --ink-faint:var(--dark-text-light);
  --line:var(--gray-300);
  --line-strong:var(--gray-400);
  --focus:var(--violet-400);

  --current:var(--orange-500);
  --current-tint:var(--orange-100);
  --current-line:var(--orange-300);

  --future:var(--blue-500);
  --future-tint:var(--blue-100);
  --future-line:var(--blue-200);

  --history:var(--gray-600);
  --history-tint:var(--gray-100);
  --history-line:var(--gray-300);

  --good:var(--green-600);
  --good-tint:var(--green-100);

  --mono:'Open Sans',sans-serif;
  --serif:'Open Sans',sans-serif;
  --sans:'Open Sans',sans-serif;

  --radius:4px;
  --shadow:0 1px 0 rgba(34,36,41,0.04), 0 8px 24px -12px rgba(34,36,41,0.16);
  --section-accent: var(--current);
  --section-tint: var(--current-tint);
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

/* ===== App shell ===== */
.app{
  display:grid;
  grid-template-columns:236px 1fr;
  min-height:100vh;
}

/* ---- Sidebar ---- */
.sidebar{
  background:var(--ink);
  color:var(--paper);
  padding:28px 20px;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  display:flex;
  align-items:baseline;
  gap:8px;
  margin-bottom:6px;
}
.brand-mark{
  width:10px;height:10px;
  background:var(--current);
  transform:rotate(45deg);
  flex-shrink:0;
}
.brand-name{
  font-family:var(--serif);
  font-weight:600;
  font-size:19px;
  letter-spacing:-0.01em;
}
.brand-sub{
  font-family:var(--mono);
  font-size:10.5px;
  color:#9399A7;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:36px;
  padding-left:18px;
}

.nav-group-label{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#9399A7;
  margin:18px 0 10px 2px;
}
.nav-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 12px;
  border-radius:4px;
  cursor:pointer;
  font-size:13.5px;
  font-weight:500;
  color:#D0D4DD;
  border-left:2px solid transparent;
  transition:background .15s ease, color .15s ease;
  margin-bottom:2px;
}
.nav-item .dot{
  width:7px;height:7px;
  border-radius:50%;
  flex-shrink:0;
  background:#585D68;
}
.nav-item:hover{ background:rgba(255,255,255,0.06); color:#fff; }
.nav-item.active{
  background:rgba(255,255,255,0.09);
  color:#fff;
  border-left-color:var(--nav-accent, var(--current));
}
.nav-item.active .dot{ background:var(--nav-accent, var(--current)); box-shadow:0 0 0 3px rgba(255,255,255,0.08);}
.nav-item .count{
  margin-left:auto;
  font-family:var(--mono);
  font-size:10.5px;
  color:#9399A7;
}
.nav-item.active .count{ color:#E2E5EB; }

.sidebar-footer{
  margin-top:auto;
  padding-top:20px;
  border-top:1px solid rgba(255,255,255,0.1);
  font-family:var(--mono);
  font-size:10.5px;
  color:#9399A7;
  line-height:1.6;
}
.sidebar-footer b{ color:#E2E5EB; font-weight:500;}

/* ---- Main ---- */
.main{
  padding:0;
  overflow-x:hidden;
}
.topbar{
  padding:26px 40px 22px;
  border-bottom:1px solid var(--line);
  background:var(--paper-raised);
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:24px;
}
.topbar-eyebrow{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--section-accent);
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:8px;
}
.topbar-eyebrow .bar{ width:20px; height:2px; background:var(--section-accent); }
.topbar h1{
  font-family:var(--serif);
  font-size:30px;
  font-weight:600;
  letter-spacing:-0.01em;
}
.topbar p.desc{
  color:var(--ink-soft);
  font-size:13.5px;
  margin-top:6px;
  max-width:620px;
}
.topbar-meta{
  font-family:var(--mono);
  font-size:11px;
  color:var(--ink-faint);
  text-align:right;
  line-height:1.7;
}

.content{
  padding:34px 40px 80px;
  max-width:1180px;
}

/* ===== Breadcrumb ===== */
.crumbs{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:var(--mono);
  font-size:11.5px;
  color:var(--ink-faint);
  margin-bottom:22px;
}
.crumbs .seg{ cursor:pointer; }
.crumbs .seg:hover{ color:var(--ink); text-decoration:underline; }
.crumbs .seg.current{ color:var(--ink); font-weight:500; text-decoration:none; cursor:default; }
.crumbs .sep{ color:var(--line-strong); }

/* ===== List rows ===== */
.btn{
  font-family:var(--sans);
  font-size:13px;
  font-weight:600;
  padding:9px 15px;
  border-radius:var(--radius);
  border:1px solid var(--violet-500);
  background:var(--violet-500);
  color:#fff;
  cursor:pointer;
  transition:background .12s ease, box-shadow .12s ease, border-color .12s ease;
  display:inline-flex;
  align-items:center;
  gap:7px;
  white-space:nowrap;
}
.btn:hover{ background:var(--violet-600); border-color:var(--violet-600); box-shadow:0 2px 8px -2px rgba(74,50,168,0.4); }
.btn.ghost{
  background:#fff;
  color:var(--ink);
  border:1px solid var(--line);
}
.btn.ghost:hover{ border-color:var(--gray-500); background:var(--gray-050); box-shadow:none; }
.btn.accent{ background:var(--section-accent); border-color:var(--section-accent); color:#fff; }
.btn.accent:hover{ filter:brightness(0.94); box-shadow:none; }
.btn.small{ padding:6px 11px; font-size:12px; }
.btn.danger-ghost{ color:var(--red-400); border-color:var(--red-200); background:#fff; }
.btn.danger-ghost:hover{ border-color:var(--red-400); background:var(--red-100); box-shadow:none; }

.tag-default{
  font-family:var(--mono);
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--ink-faint);
  border:1px solid var(--line-strong);
  padding:2px 6px;
  border-radius:20px;
  font-weight:600;
}

/* ===== Tier list table ===== */
.list-toolbar{ display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:14px; }
.list-search{ width:280px; }
.list-search input{ font-size:13px; padding:9px 12px; }
.tier-table{
  width:100%;
  border-collapse:collapse;
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:var(--shadow);
}
.tier-table thead th{
  text-align:left;
  font-family:var(--sans);
  font-weight:700;
  font-size:13px;
  color:var(--ink);
  padding:14px 20px;
  border-bottom:2px solid var(--line);
  background:var(--paper-raised);
}
.tier-table thead th:first-child{ border-top-left-radius:8px; }
.tier-table thead th:last-child{ border-top-right-radius:8px; }
.tier-table tbody td{
  padding:20px 20px;
  border-bottom:1px solid var(--line);
  font-size:14px;
  color:var(--ink);
  vertical-align:middle;
  background:var(--paper-raised);
}
.tier-table tbody tr{ cursor:pointer; transition:background .12s ease; }
.tier-table tbody tr:hover td{ background:var(--paper); }
.tier-table tbody tr:last-child td{ border-bottom:none; }
.tier-table tbody tr:last-child td:first-child{ border-bottom-left-radius:8px; }
.tier-table tbody tr:last-child td:last-child{ border-bottom-right-radius:8px; }
.tier-table .name-cell{ display:flex; align-items:center; gap:8px; font-weight:600; }
.std-summary-wrap{ position:relative; width:fit-content; }
.std-summary-icon{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:15px;
  height:15px;
  border-radius:50%;
  background:var(--gray-200, #e5e5e5);
  color:var(--ink-faint);
  font-size:10px;
  font-weight:700;
  flex-shrink:0;
}
.std-summary-popover{
  position:absolute;
  top:50%;
  left:calc(100% + 12px);
  min-width:300px;
  max-width:380px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:var(--shadow);
  padding:12px 14px;
  opacity:0;
  visibility:hidden;
  transform:translateY(-50%) translateX(-4px);
  transition:opacity .12s ease, transform .12s ease, visibility .12s ease;
  z-index:30;
  cursor:default;
}
.std-summary-wrap:hover .std-summary-popover{
  opacity:1;
  visibility:visible;
  transform:translateY(-50%) translateX(0);
}
.std-summary-popover::before{
  content:'';
  position:absolute;
  top:50%;
  right:100%;
  transform:translateY(-50%);
  border:6px solid transparent;
  border-right-color:#fff;
}
.std-summary-popover .popover-title{
  font-family:var(--mono);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.06em;
  font-weight:700;
  color:var(--ink-faint);
  margin-bottom:8px;
}
.std-summary-row{ padding:6px 0; border-top:1px solid var(--line); }
.std-summary-row:first-child{ border-top:none; }
.std-summary-product{
  font-family:var(--sans);
  font-size:12.5px;
  font-weight:700;
  color:var(--ink);
  margin-bottom:3px;
}
.std-summary-fields{
  display:flex;
  flex-direction:column;
  gap:2px;
  font-family:var(--sans);
  font-size:12px;
  font-weight:400;
  color:var(--ink);
}
.std-summary-label{ color:var(--ink-faint); font-weight:600; margin-right:5px; }
.std-summary-note{
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid var(--line);
  font-family:var(--sans);
  font-size:11.5px;
  font-style:italic;
  color:var(--ink-faint);
}
.tier-table-static tbody tr{ cursor:default; }
.tier-table-static tbody tr:hover td{ background:var(--paper-raised); }
.tier-table-static tbody tr.clickable{ cursor:pointer; }
.tier-table-static tbody tr.clickable:hover td{ background:var(--paper); }
.type-chip{
  display:inline-flex;
  align-items:center;
  font-family:var(--sans);
  font-weight:700;
  font-size:12px;
  padding:5px 12px;
  border-radius:20px;
  cursor:default;
}
.type-chip.standard{ background:var(--blue-100); color:var(--blue-400); }
.type-chip.custom{ background:var(--green-100); color:var(--green-600); }
.type-chip.none{ background:var(--gray-100); color:var(--gray-500); }

.icon-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:30px; height:30px;
  border:1px solid var(--line);
  border-radius:6px;
  background:var(--paper-raised);
  color:var(--ink-soft);
  cursor:pointer;
  font-size:13px;
  transition:background .12s ease, border-color .12s ease, color .12s ease;
}
.icon-btn:hover{ background:var(--violet-100); border-color:var(--violet-200); color:var(--ink); }

.bo-toggle-row{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
.bo-toggle-row .toggle-label{ font-family:var(--sans); font-size:14px; font-weight:700; color:var(--ink); }

.type-chip-wrap{ position:relative; display:inline-block; }
.type-chip-popover{
  position:absolute;
  top:calc(100% + 10px);
  left:50%;
  transform:translateX(-50%) translateY(4px);
  min-width:220px;
  max-width:320px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:var(--shadow);
  padding:12px 14px;
  z-index:70;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .14s ease, transform .14s ease;
  text-align:left;
  cursor:default;
}
.type-chip-wrap:hover .type-chip-popover{
  opacity:1;
  visibility:visible;
  transform:translateX(-50%) translateY(0);
}
.type-chip-popover::before{
  content:'';
  position:absolute;
  bottom:100%;
  left:50%;
  transform:translateX(-50%);
  border:6px solid transparent;
  border-bottom-color:#fff;
}
.type-chip-popover .popover-group{ margin-bottom:9px; }
.type-chip-popover .popover-group:last-child{ margin-bottom:0; }
.type-chip-popover .popover-label{
  font-family:var(--mono);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.06em;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:4px;
  color:var(--ink-faint);
}
.type-chip-popover .popover-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.type-chip-popover .popover-dot.standard{ background:var(--blue-400); }
.type-chip-popover .popover-dot.custom{ background:var(--green-600); }
.type-chip-popover .popover-dot.none{ background:var(--gray-500); }
.type-chip-popover .popover-names{
  font-family:var(--sans);
  font-size:12.5px;
  color:var(--ink);
  line-height:1.5;
}

/* ===== Chip multi-select ===== */
.chip-select{ position:relative; }
.chip-select-box{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
  min-height:38px;
  padding:6px 34px 6px 8px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  cursor:pointer;
  position:relative;
}
.chip-select.open .chip-select-box{ border-color:var(--section-accent); }
.chip-select-chips{ display:flex; flex-wrap:wrap; gap:6px; flex:1; }
.chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:var(--current-tint, #f2f2f2);
  color:var(--ink);
  font-family:var(--sans);
  font-size:12px;
  font-weight:600;
  padding:4px 6px 4px 10px;
  border-radius:999px;
  line-height:1.3;
}
.chip-remove{
  border:none;
  background:transparent;
  cursor:pointer;
  font-size:14px;
  line-height:1;
  color:var(--ink-faint);
  padding:0 2px;
  font-family:var(--sans);
}
.chip-remove:hover{ color:var(--red-400); }
.chip-select-arrow{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  font-size:13px;
  color:var(--ink-faint);
  pointer-events:none;
}
.chip-select-dropdown{
  display:none;
  position:absolute;
  top:calc(100% + 6px);
  left:0;
  right:0;
  max-height:220px;
  overflow-y:auto;
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:var(--shadow);
  padding:6px;
  z-index:20;
}
.chip-select.open .chip-select-dropdown{ display:block; }
.chip-option{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 8px;
  border-radius:6px;
  font-family:var(--sans);
  font-size:13px;
  color:var(--ink);
  cursor:pointer;
}
.chip-option:hover{ background:var(--gray-50, #f7f7f7); }
.chip-option input[type=checkbox]{ margin:0; }
.chip-select-count{
  margin-top:6px;
  font-family:var(--sans);
  font-size:11.5px;
  color:var(--ink-faint);
}

/* ===== Detail ===== */
.detail-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:22px;
  gap:20px;
}
.detail-header h2{
  font-family:var(--serif);
  font-size:26px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:10px;
}
.detail-header .sub{
  font-family:var(--mono);
  font-size:11px;
  color:var(--ink-faint);
  margin-top:6px;
}
.detail-actions{ display:flex; gap:10px; flex-shrink:0; }

.back-arrow{ cursor:pointer; color:var(--ink-faint); transition:color .12s ease; }
.back-arrow:hover{ color:var(--ink); }

/* ===== Regulierer Standard detail ===== */
.tab-row-with-actions{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:18px; }
.tab-row-with-actions .tab-row{ margin-bottom:0; }
.reg-breakdown-triggers{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }

.reg-sidebar-stack{ display:flex; flex-direction:column; gap:16px; }
.scope-select-wrap{ padding:14px; }
.scope-select-wrap select{ width:100%; }
.scope-list-header .range-toggle-link{ padding:0; font-size:10.5px; }


.radio-row{ display:flex; flex-wrap:wrap; align-items:center; gap:18px; margin-top:6px; }
.radio-option{
  display:flex;
  align-items:center;
  gap:6px;
  font-family:var(--sans);
  font-size:13px;
  font-weight:400;
  color:var(--ink);
  cursor:pointer;
}
.radio-option input[type=radio]{
  appearance:none;
  -webkit-appearance:none;
  -moz-appearance:none;
  width:16px;
  height:16px;
  flex-shrink:0;
  margin:0;
  border:1.5px solid var(--line-strong);
  border-radius:50%;
  background:#fff;
  cursor:pointer;
  position:relative;
  transition:border-color .12s ease;
}
.radio-option input[type=radio]:hover{ border-color:var(--section-accent); }
.radio-option input[type=radio]:checked{ border-color:var(--section-accent); }
.radio-option input[type=radio]:checked::before{
  content:'';
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--section-accent);
}

.inherit-callout{
  border:1px dashed var(--line-strong);
  border-radius:4px;
  padding:36px 30px;
  text-align:center;
  background:var(--paper-raised);
}
.inherit-callout .icon{ font-size:22px; margin-bottom:12px; }
.inherit-callout h3{ font-family:var(--serif); font-size:19px; margin-bottom:8px; }
.inherit-callout p{ font-size:13px; color:var(--ink-soft); max-width:420px; margin:0 auto 18px; }

.scope-layout{
  display:grid;
  grid-template-columns:200px 1fr;
  gap:28px;
  align-items:start;
}
.scope-list{
  border:1px solid var(--line);
  background:var(--paper-raised);
  border-radius:4px;
  overflow:hidden;
}
.scope-list-header{
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  font-family:var(--mono);
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--ink-faint);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.scope-item{
  padding:14px;
  border-bottom:1px solid var(--line);
  cursor:pointer;

// Builds one read-only historical snapshot entry (validFrom/validTo + a full
// Pauschal/Individual/Andere period), used to seed example past pricing on
// the History tab of Regulierer Standards, Regulierer experts, and BO.
function regHistoryEntry(validFrom, validTo, overrides){
  overrides = overrides || {};
  const period = freshRegulierPeriod();
  if(overrides.pauschal) Object.assign(period.pauschal, overrides.pauschal);

}

// A Regulierer Standard's pricing defaults to one universal config that
// applies to every insurer and every product. Users can optionally "break
// down" by insurer and/or by product — each is an independent, opt-in
// override dimension (not a combined insurer+product matrix): picking an
// insurer edits that insurer's config for all products, picking a product
// edits that product's config for all insurers. Clearing a breakdown drops
// all overrides for that dimension and reverts to the universal config.
function freshRegStandard(name){
  return {
    name,
    currentValidity:{ from:'2025-01-01', to:'2025-12-31' },
    futureValidity:{ from:'', to:'' },
    insurerBreakdown:false,
    byInsurer:{},   // { insurerId: { current: period, future: period } }
    productBreakdown:false,
    byProduct:{},   // { productId: { current: period, future: period } }
    universal:{ current: freshRegulierPeriod(), future: freshRegulierPeriod() },
    history:[],     // [{ validFrom, validTo, period }] — past superseded configs, read-only
  };
}

function currentPricingSinceDate(tierId){
  const periods = TIER_HISTORY_PERIODS[tierId];

// Add extra cost" select with already-used types left out entirely, and
// show a plain message once every type has been added.
function extraCostAddSelectHtml(extraCosts, disabled){
  const dis = disabled ? 'disabled' : '';
  const usedTypes = (extraCosts||[]).map(c=>c.costType);
  const remaining = ALL_EXTRA_COST_TYPES.filter(t=>!usedTypes.includes(t));
  if(!remaining.length){
    return `<div class="hint" style="margin:0;">All extra cost types have already been added.</div>`;
  }
  // No fixed id here: the Extra costs section can render more than one of
  // these concurrently (the default list plus any number of insurer-group
  // overrides), so wiring targets it via the shared class instead and
  // resolves which list it belongs to by walking up to the nearest
  // [data-override-idx] ancestor (see extraCostsListFor in renderGeneralConfigs).
  return `
    <select class="add-extra-cost-select" style="max-width:220px;" ${dis}>
      <option value="">+ Add extra cost…</option>
      ${remaining.map(t=>`<option value="${t}">${t}</option>`).join('')}
    </select>`;
}

function tierName(id){ return STANDARD_TIERS[id] ? STANDARD_TIERS[id].name : (INSURERS.find(i=>i.id===id)||{}).name; }
function isCustom(tierId){ return isStandardTier(tierId) ? true : INSURER_STATE[tierId].custom; }
function effectiveProducts(tierId){ return isStandardTier(tierId) ? STANDARD_TIERS[tierId].products : (INSURER_STATE[tierId].products || standardProducts); }
function standardTierSummaryHtml(tierId){
  const products = STANDARD_TIERS[tierId].products;
  return PRODUCTS.map(p=>{
    const cur = (products[p.id] || {}).current;
    if(!cur) return '';
    const pauschalTxt = (cur.pauschal.rangePricing && cur.pauschal.rangePricing.enabled)
      ? `${cur.pauschal.rangePricing.ranges.length} Schadenhöhe-Bereich${cur.pauschal.rangePricing.ranges.length===1?'':'e'}`
      : (Number(cur.pauschal.price) ? `${cur.pauschal.price} EUR` : '—');
    const individualTxt = (Number(cur.individual.hourRate) || Number(cur.individual.kmRate) || Number(cur.individual.drivingTimeRate))
      ? `${Number(cur.individual.hourRate)||0} EUR/h, ${Number(cur.individual.kmRate)||0} EUR/km, ${Number(cur.individual.drivingTimeRate)||0} EUR/h Fahrzeit`
      : '—';
    return `

        <div class="std-summary-product">${p.name}</div>

          <span><span class="std-summary-label">Individual</span>${individualTxt}</span>
        </div>
      </div>`;
  }).join('');
}
function sectionIsEmptyForProduct(period, section){
  if(section === 'pauschal'){
    const p = period.pauschal;
    if(p.rangePricing && p.rangePricing.enabled){
      return !p.rangePricing.ranges.length || p.rangePricing.ranges.every(r => !Number(r.price));
    }
    return !Number(p.price);
  }
  if(section === 'individual'){
    const i = period.individual;
    return !Number(i.hourRate) && !Number(i.kmRate) && !Number(i.drivingTimeRate);
  }
  if(section === 'other'){
    const o = period.other;
    if(!o.extraCostsEnabled) return true;
    return !(o.extraCosts && o.extraCosts.some(c => Number(c.value)));
  }
  return false;
}
function tierSectionStatus(tierId, section){
  if(isStandardTier(tierId)) return null;
  if(!isCustom(tierId)) return 'Standard';
  const products = effectiveProducts(tierId);
  // "Keine" means: this section is customized (Einzelvereinbarung) on at least
  // one product, but every customized value is zero/unset — i.e. someone set
  // up a custom config (or disabled it, for Extra costs) without actually
  // entering a price. Products still following Standard for this section
  // don't count towards this — inheriting Standard is never "Keine", even if
  // the Standard value itself happens to be zero.
  const customProducts = Object.values(products).filter(pr => pr.current[section].configType === 'Einzelvereinbarung');
  if(!customProducts.length) return 'Standard';
  const allCustomEmpty = customProducts.every(pr => sectionIsEmptyForProduct(pr.current, section));
  return allCustomEmpty ? 'Keine' : 'Einzelvereinbarung';
}
function productTypeBreakdown(tierId, section){
  const products = effectiveProducts(tierId);
  const standardNames = [];
  const customNames = [];
  Object.keys(products).forEach(pid=>{
    const p = findProduct(pid);
    const name = p ? p.name : pid;
    const cfg = products[pid].current[section].configType;
    if(cfg === 'Einzelvereinbarung') customNames.push(name); else standardNames.push(name);
  });
  return { standardNames, customNames };
}
function tierHasPlannedChange(tierId){
  const products = effectiveProducts(tierId);
  return Object.values(products).some(pr => JSON.stringify(pr.current) !== JSON.stringify(pr.future));
}

// Hover summary for a Regulierer Standard / BO Standard row: reflects the
// entity's universal current period (the same "internal configuration"
// pattern used for Standard Tier rows in the Preise Versicherer list).
function regStandardSummaryHtml(entity, kind){
  const period = entity.universal.current;
  const feeUnit = period.pauschal.feeType === 'Prozentsatz' ? '%' : 'EUR';
  const pauschalTxt = (period.pauschal.rangePricing && period.pauschal.rangePricing.enabled)
    ? `${period.pauschal.rangePricing.ranges.length} Schadenhöhe-Bereich${period.pauschal.rangePricing.ranges.length===1?'':'e'}`
    : (Number(period.pauschal.fee) ? `${period.pauschal.fee} ${feeUnit} (${period.pauschal.feeType})` : '—');

  const individualParts = [];
  if(kind === 'bo' && period.individual.billingType === 'Prozentsatz'){
    if(Number(period.individual.percentRate)) individualParts.push(`${period.individual.percentRate}%`);
  } else {
    if(Number(period.individual.hourRate)) individualParts.push(`${period.individual.hourRate} EUR/h`);
    if(kind !== 'bo'){
      if(Number(period.individual.kmRate)) individualParts.push(`${period.individual.kmRate} EUR/km`);
      if(Number(period.individual.driveRate)) individualParts.push(`${period.individual.driveRate} EUR/h Fahrzeit`);
    }
  }
  const individualTxt = individualParts.length ? individualParts.join(', ') : '—';

  const otherTxt = period.other.creditingMethod || '—';

  const breakdownBits = [];
  if(entity.insurerBreakdown) breakdownBits.push(`${Object.keys(entity.byInsurer||{}).length} Versicherer`);
  if(entity.productBreakdown) breakdownBits.push(`${Object.keys(entity.byProduct||{}).length} Produkte`);
  const breakdownNote = breakdownBits.length
    ? `<div class="std-summary-note">Aufteilung aktiv: ${breakdownBits.join(', ')}</div>`
    : '';

  return `
    <div class="std-summary-row">
      <div class="std-summary-fields">
        <span><span class="std-summary-label">Pauschal</span>${pauschalTxt}</span>
        <span><span class="std-summary-label">Individual</span>${individualTxt}</span>
        <span><span class="std-summary-label">Andere Konfigurationen</span>${otherTxt}</span>
      </div>
      ${breakdownNote}
    </div>`;
}

              ${period.pauschal.feeType==='Prozentsatz' ? `<div class="hint" style="margin-top:-4px; margin-bottom:6px;">Preis = % of the claim size for each range</div>` : ''}
              <div class="range-table" id="reg-range-table">
                ${rp.ranges.map((r,i)=>regRangeRowHtml(r,i,rp.ranges.length,locked,period.pauschal.feeType)).join('')}
              </div>
              <div class="range-actions">
                <button class="btn ghost small" id="reg-add-interval-btn" type="button" ${dis}>+ Add interval</button>
              </div>
            </div>`}
          </div>
        </div>

        <div class="section-block" id="reg-block-individual">
          <div class="section-block-head">
            <div class="stitle2"><span class="num">2</span> Individual Pricing</div>
            <div class="htag">usage-based</div>
          </div>
          <div class="section-block-body">
            ${kind==='bo' ? `
            <div class="field span-3">
              <label class="required">Abrechnungsart</label>
              <div class="radio-row">
                <label class="radio-option"><input type="radio" name="reg-individual-billing-type" value="Stunde" ${(period.individual.billingType||'Stunde')==='Stunde'?'checked':''} ${dis}> Per Hour</label>
                <label class="radio-option"><input type="radio" name="reg-individual-billing-type" value="Prozentsatz" ${period.individual.billingType==='Prozentsatz'?'checked':''} ${dis}> Per %</label>
              </div>
            </div>
            ${period.individual.billingType==='Prozentsatz' ? `
            <div class="field">
              <label class="required">Prozentsatz (%)</label>
              <div class="input-wrap"><input type="text" id="reg-f-individual-percent" value="${period.individual.percentRate||0}" ${dis}><span class="unit">%</span></div>
              <div class="hint">% of the amount payed to Regulierer on a claim basis</div>
            </div>` : `
            <div class="field">
              <label class="required">Stundensatz (€)</label>
              <div class="input-wrap"><input type="text" id="reg-f-hour" value="${period.individual.hourRate}" ${dis}><span class="unit">EUR/h</span></div>
            </div>`}
            ` : `
            <div class="field">
              <label class="required">Stundensatz (€)</label>
              <div class="input-wrap"><input type="text" id="reg-f-hour" value="${period.individual.hourRate}" ${dis}><span class="unit">EUR/h</span></div>
            </div>
            <div class="field">
              <label class="required">KM pauschale (€)</label>
              <div class="input-wrap"><input type="text" id="reg-f-km" value="${period.individual.kmRate}" ${dis}><span class="unit">EUR/km</span></div>
            </div>
            <div class="field">
              <label class="required">Fahrzeitaufwand (€)</label>
              <div class="input-wrap"><input type="text" id="reg-f-drive" value="${period.individual.driveRate}" ${dis}><span class="unit">EUR/h</span></div>
            </div>`}
          </div>
        </div>

        <div class="section-block" id="reg-block-other">
          <div class="section-block-head">
            <div class="stitle2"><span class="num">3</span> Andere Konfigurationen</div>
          </div>
          <div class="section-block-body" style="grid-template-columns:1fr;">
            <div class="field">
              <label>${kind === 'bo' ? 'Default BO crediting method' : 'Default Regulierer crediting method'}</label>
              <div class="radio-row">
                <label class="radio-option"><input type="radio" name="reg-crediting" value="Pauschal" ${period.other.creditingMethod==='Pauschal'?'checked':''} ${dis}> Pauschal</label>
                <label class="radio-option"><input type="radio" name="reg-crediting" value="Individual" ${period.other.creditingMethod==='Individual'?'checked':''} ${dis}> Individual</label>
                <span class="hint">${kind === 'bo' ? 'ⓘ This information can be changed during claim handling on a claim basis level.' : 'ⓘ This information can be changed during claim handling by BO on a claim basis level.'}</span>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  `;

  if(locked) return;

  document.getElementById('reg-f-feetype').addEventListener('change', e=>{ period.pauschal.feeType = e.target.value; rerender(); });

  if(!rp.enabled){
    document.getElementById('reg-f-fee').addEventListener('input', e=>{ period.pauschal.fee = e.target.value===''?'':Number(e.target.value)||0; });
    const addRangeBtn = document.getElementById('reg-add-range-btn');
    if(addRangeBtn){
      addRangeBtn.addEventListener('click', ()=>{
        rp.enabled = true;
        if(!rp.ranges.length) rp.ranges.push({ from:0, to:1000, price:period.pauschal.fee||0 });
        rerender();
      });
    }
  } else {
    document.getElementById('reg-remove-range-btn').addEventListener('click', ()=>{
      rp.enabled = false;
      rerender();
    });
    document.getElementById('reg-add-interval-btn').addEventListener('click', ()=>{
      const last = rp.ranges[rp.ranges.length-1];
      rp.ranges.push({ from: last ? last.to : 0, to: (last ? last.to : 0) + 1000, price:0 });
      rerender();
    });
    document.querySelectorAll('.reg-range-to-input').forEach(el=>{
      el.addEventListener('input', e=>{
        const idx = Number(el.dataset.idx);
        rp.ranges[idx].to = e.target.value === '' ? '' : Number(e.target.value);
        if(rp.ranges[idx+1]) rp.ranges[idx+1].from = rp.ranges[idx].to || 0;
      });
    });
    document.querySelectorAll('.reg-range-price-input').forEach(el=>{
      el.addEventListener('input', e=>{
        const idx = Number(el.dataset.idx);
        rp.ranges[idx].price = e.target.value === '' ? '' : Number(e.target.value);
      });
    });
    document.querySelectorAll('.reg-range-delete-btn').forEach(el=>{
      el.addEventListener('click', ()=>{
        const idx = Number(el.dataset.idx);
        rp.ranges.splice(idx,1);
        rp.ranges.forEach((r,i)=>{ r.from = i===0 ? 0 : (rp.ranges[i-1].to || 0); });
        if(rp.ranges.length===0) rp.enabled = false;
        rerender();
      });
    });
  }

  const hourInput = document.getElementById('reg-f-hour');
  if(hourInput) hourInput.addEventListener('input', e=>{ period.individual.hourRate = e.target.value===''?'':Number(e.target.value)||0; });
  const kmInput = document.getElementById('reg-f-km');
  if(kmInput) kmInput.addEventListener('input', e=>{ period.individual.kmRate = e.target.value===''?'':Number(e.target.value)||0; });
  const driveInput = document.getElementById('reg-f-drive');
  if(driveInput) driveInput.addEventListener('input', e=>{ period.individual.driveRate = e.target.value===''?'':Number(e.target.value)||0; });
  const percentInput = document.getElementById('reg-f-individual-percent');
  if(percentInput) percentInput.addEventListener('input', e=>{ period.individual.percentRate = e.target.value===''?'':Number(e.target.value)||0; });
  document.querySelectorAll('input[name="reg-individual-billing-type"]').forEach(el=>{
    el.addEventListener('change', e=>{ period.individual.billingType = e.target.value; rerender(); });
  });

  document.querySelectorAll('input[name="reg-crediting"]').forEach(el=>{
    el.addEventListener('change', e=>{ period.other.creditingMethod = e.target.value; });
  });
}

/* ===================== RENDER: REGULIERER STANDARD DETAIL ===================== */
function renderRegStdDetail(){
  const kind = state.regKind || 'standard';
  const isExpert = kind === 'expert';
  const entity = regGetEntity(kind, state.regStdId);
  if(!entity){ state.regStdId = null; state.regKind = null; render(); return; }

  // Experts can either follow one of the Standards (locked, read-only,
  // mirrors that Standard's universal values) or run their own
  // Einzelvereinbarung (fully editable, same mechanics as a Standard page).
  const referencedStandard = (isExpert && entity.configType !== 'Einzelvereinbarung')
    ? REGULIERER_STANDARDS.find(s=>s.id===entity.configType)
    : null;
  const locked = !!referencedStandard;

  // Breakdown active but nothing selected yet (e.g. just navigated in) —
  // default to the first available option rather than an "all" state,
  // since there is no "Alle Versicherer" / "Alle Produkte" option anymore.
  if(!locked){
    if(entity.insurerBreakdown && !state.regSelectedInsurer){
      const key = Object.keys(entity.byInsurer)[0] || (INSURERS[0] && INSURERS[0].id);
      if(key){
        if(!entity.byInsurer[key]) entity.byInsurer[key] = cloneReg(entity.universal);
        state.regSelectedInsurer = key;
      }
    }
    if(entity.productBreakdown && !state.regSelectedProduct){
      const key = Object.keys(entity.byProduct)[0] || (REGULIERER_PRODUCTS[0] && REGULIERER_PRODUCTS[0].id);
      if(key){
        if(!entity.byProduct[key]) entity.byProduct[key] = cloneReg(entity.universal);
        state.regSelectedProduct = key;
      }
    }
  }

  const periodTab = state.regPeriodTab;
  const validity = periodTab==='future' ? entity.futureValidity : entity.currentValidity;
  const sectionLabel = kind === 'bo' ? 'BO Gebühren' : 'Regulierer Gebühren';

  const topFieldHtml = isExpert ? `
    <div class="field" style="max-width:420px; margin-bottom:20px;">
      <label class="required">Preiskonfigurationstyp</label>
      <select id="reg-configtype-select">
        ${REGULIERER_STANDARDS.map(s=>`<option value="${s.id}" ${entity.configType===s.id?'selected':''}>${s.name}</option>`).join('')}
        <option value="Einzelvereinbarung" ${entity.configType==='Einzelvereinbarung'?'selected':''}>Einzelvereinbarung</option>
      </select>
    </div>` : (kind === 'bo' ? '' : `
    <div class="field" style="max-width:420px; margin-bottom:20px;">
      <label class="required">Name Standardgebühr</label>
      <input type="text" id="reg-name-input" value="${entity.name}">
    </div>`);

  let html = `
    <div class="crumbs">
      <span class="seg" data-reg-crumb-back>${sectionLabel}</span>
      <span class="sep">/</span>
      <span class="seg current">${entity.name}</span>
    </div>
    <div class="detail-header">
      <div>
        <h2><span class="back-arrow" id="reg-back-btn" title="Back to ${sectionLabel}">←</span> ${entity.name} bearbeitung</h2>
      </div>
      <div class="detail-actions">
        ${periodTab!=='history' ? `<button class="btn accent small" id="reg-save-btn" type="button">Speichern</button>` : ''}
      </div>
    </div>

    ${topFieldHtml}

    <div class="tab-row-with-actions">
      <div class="tab-row">
        <button class="tab-btn tab-current ${periodTab==='current'?'active':''}" id="reg-tab-current-btn"><span class="tdot"></span> Current Pricing</button>
        <button class="tab-btn tab-future ${periodTab==='future'?'active':''}" id="reg-tab-future-btn"><span class="tdot"></span> Future Pricing</button>
        <button class="tab-btn tab-history ${periodTab==='history'?'active':''}" id="reg-tab-history-btn"><span class="tdot"></span> Pricing history</button>
      </div>
      ${(periodTab!=='history' && !locked && (!entity.insurerBreakdown || !entity.productBreakdown)) ? `
      <div class="reg-breakdown-triggers">
        ${!entity.insurerBreakdown ? `<button class="btn ghost small" id="reg-activate-insurer-btn" type="button">+ Nach Versicherer aufteilen</button>` : ''}
        ${!entity.productBreakdown ? `<button class="btn ghost small" id="reg-activate-product-btn" type="button">+ Nach Produkte aufteilen</button>` : ''}
      </div>` : ''}
    </div>
  `;

  if(periodTab === 'history'){
    const historyList = entity.history || [];
    if(state.regHistoryIdx >= historyList.length) state.regHistoryIdx = 0;
    const histEntry = historyList.length ? historyList[state.regHistoryIdx] : null;

    const historyBanner = historyList.length ? `
      <div class="planned-banner" style="color:var(--history); background:var(--history-tint); border-color:var(--history-line);">
        🔒 Valid period
        <select id="reg-history-period-select">
          ${historyList.map((h,i)=>`<option value="${i}" ${i===state.regHistoryIdx?'selected':''}>${h.validFrom} → ${h.validTo}</option>`).join('')}
        </select>
        <span style="margin-left:8px; font-family:var(--sans); font-size:11px; color:var(--ink-faint);">read-only — superseded pricing</span>
      </div>` : '';

    html += `
      ${historyBanner}
      ${histEntry ? `<div id="reg-editor-slot"></div>` : `<div class="checkbox-empty" style="padding:40px 14px; text-align:center;">No historical pricing recorded for ${entity.name} yet.</div>`}
    `;
    document.getElementById('content').innerHTML = html;
    wireRegNavHandlers(entity, { isExpert, kind });

    const historySelect = document.getElementById('reg-history-period-select');
    if(historySelect){
      historySelect.addEventListener('change', e=>{
        state.regHistoryIdx = Number(e.target.value);
        render();
      });
    }

    if(histEntry){
      renderRegEditorSlot(entity, {
        kind,
        locked: true,
        period: histEntry.period,
        headTitle: 'Alle Produkte',
        headSub: `${entity.name} · ${histEntry.validFrom} → ${histEntry.validTo}`,
      });
    }
    return;
  }

  if(locked){
    html += `
      <div class="cost-ref-info" style="margin-bottom:18px;">
        <span>ⓘ</span>
        <span>${entity.name} follows ${referencedStandard.name}'s pricing — fields below are read-only. Switch to Einzelvereinbarung above to set independent rates.</span>
      </div>
      <div id="reg-editor-slot"></div>
    `;
    document.getElementById('content').innerHTML = html;
    wireRegNavHandlers(entity, { isExpert, kind });
    renderRegEditorSlot(entity, {
      kind,
      locked:true,
      period: referencedStandard.universal[periodTab],
      headTitle: 'Alle Produkte',
      headSub: `${entity.name} · folgt ${referencedStandard.name}`,
    });
    return;
  }

  html += `
    ${periodTab==='future' ? `
    <div class="planned-banner">📅 Planned changes shown below — take effect on <input type="date" id="reg-valid-from" value="${validity.from}"> · not yet live</div>
    <div class="future-warning">⚠ <span>As soon as the start date above is reached, these configurations will automatically <b>replace</b> the current configurations — no further action is required.</span></div>` : ''}

    ${(!entity.insurerBreakdown && !entity.productBreakdown) ? `
    <div id="reg-editor-slot"></div>` : `
    <div class="scope-layout">
      <div class="reg-sidebar-stack">
        ${entity.insurerBreakdown ? `
        <div class="scope-list">
          <div class="scope-list-header">
            Versicherer
            <button class="range-toggle-link" id="reg-clear-insurer-btn" type="button" style="color:var(--red-400); padding:0;">Entfernen</button>
          </div>
          <div class="scope-select-wrap">
            <select id="reg-insurer-select">
              ${INSURERS.map(i=>`<option value="${i.id}" ${state.regSelectedInsurer===i.id?'selected':''}>${i.name}</option>`).join('')}
            </select>
          </div>
        </div>` : ''}
        ${entity.productBreakdown ? `
        <div class="scope-list">
          <div class="scope-list-header">
            Produkte
            <button class="range-toggle-link" id="reg-clear-product-btn" type="button" style="color:var(--red-400); padding:0;">Entfernen</button>
          </div>
          ${REGULIERER_PRODUCTS.map(p=>`
          <div class="scope-item ${state.regSelectedProduct===p.id?'active':''}" data-reg-product-tab="${p.id}">
            <div class="stitle">${p.name}</div>
          </div>`).join('')}
        </div>` : ''}
      </div>
      <div id="reg-editor-slot"></div>
    </div>`}
  `;

  document.getElementById('content').innerHTML = html;
  wireRegNavHandlers(entity, { isExpert, kind });

  const validFromInput = document.getElementById('reg-valid-from');
  if(validFromInput) validFromInput.addEventListener('change', e=>{ validity.from = e.target.value; });

  const activateInsurerBtn = document.getElementById('reg-activate-insurer-btn');
  if(activateInsurerBtn){
    activateInsurerBtn.addEventListener('click', ()=>{
      entity.insurerBreakdown = true;
      const firstIns = INSURERS[0];
      if(firstIns){
        if(!entity.byInsurer[firstIns.id]) entity.byInsurer[firstIns.id] = cloneReg(entity.universal);
        state.regSelectedInsurer = firstIns.id;
      }
      renderRegStdDetail();
    });
  }
  const insurerSelect = document.getElementById('reg-insurer-select');
  if(insurerSelect){
    insurerSelect.addEventListener('change', e=>{
      const insId = e.target.value;
      if(!entity.byInsurer[insId]) entity.byInsurer[insId] = cloneReg(entity.universal);
      state.regSelectedInsurer = insId;
      renderRegStdDetail();
    });
  }
  const clearInsurerBtn = document.getElementById('reg-clear-insurer-btn');
  if(clearInsurerBtn){
    clearInsurerBtn.addEventListener('click', ()=>{
      entity.insurerBreakdown = false;
      entity.byInsurer = {};
      state.regSelectedInsurer = null;
      showToast('Unterscheidung nach Versicherer gelöscht');
      renderRegStdDetail();
    });
  }

  const activateProductBtn = document.getElementById('reg-activate-product-btn');
  if(activateProductBtn){
    activateProductBtn.addEventListener('click', ()=>{
      entity.productBreakdown = true;
      const firstProd = REGULIERER_PRODUCTS[0];
      if(firstProd){
        if(!entity.byProduct[firstProd.id]) entity.byProduct[firstProd.id] = cloneReg(entity.universal);
        state.regSelectedProduct = firstProd.id;
      }
      renderRegStdDetail();
    });
  }
  document.querySelectorAll('[data-reg-product-tab]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const prodId = el.dataset.regProductTab;
      if(!entity.byProduct[prodId]) entity.byProduct[prodId] = cloneReg(entity.universal);
      state.regSelectedProduct = prodId;
      renderRegStdDetail();
    });
  });
  const clearProductBtn = document.getElementById('reg-clear-product-btn');
  if(clearProductBtn){
    clearProductBtn.addEventListener('click', ()=>{
      entity.productBreakdown = false;
      entity.byProduct = {};
      state.regSelectedProduct = null;
      showToast('Unterscheidung nach Produkte gelöscht');
      renderRegStdDetail();
    });
  }

  renderRegEditorSlot(entity, { kind });
}

function wireRegNavHandlers(entity, opts){
  opts = opts || {};
  const isExpert = !!opts.isExpert;
  const kind = opts.kind || (isExpert ? 'expert' : 'standard');

  document.querySelector('[data-reg-crumb-back]').addEventListener('click', ()=>{
    state.regStdId = null;
    state.regKind = null;
    render();
  });
  document.getElementById('reg-back-btn').addEventListener('click', ()=>{
    state.regStdId = null;
    state.regKind = null;
    render();
  });
  document.getElementById('reg-tab-current-btn').addEventListener('click', ()=>{ state.regPeriodTab = 'current'; render(); });
  document.getElementById('reg-tab-future-btn').addEventListener('click', ()=>{ state.regPeriodTab = 'future'; render(); });
  document.getElementById('reg-tab-history-btn').addEventListener('click', ()=>{ state.regPeriodTab = 'history'; render(); });

  const configTypeSelect = document.getElementById('reg-configtype-select');
  if(configTypeSelect){
    configTypeSelect.addEventListener('change', e=>{
      entity.configType = e.target.value;
      state.regSelectedInsurer = null;
      state.regSelectedProduct = null;
      showToast('Preiskonfigurationstyp aktualisiert');
      render();
    });
  }

  const nameInput = document.getElementById('reg-name-input');
  const saveBtn = document.getElementById('reg-save-btn');
  if(saveBtn){
    saveBtn.addEventListener('click', ()=>{
      if(nameInput){
        const newName = nameInput.value.trim();
        if(newName) entity.name = newName;
      }
      showToast(isExpert ? 'Regulierer gespeichert' : (kind === 'bo' ? 'BO Standard gespeichert' : 'Regulierer Standard gespeichert'));
      render();
    });
  }
}

/* ===================== RENDER: TIER LIST ===================== */
function renderTierList(){
  document.documentElement.style.setProperty('--section-accent','var(--current)');
  document.documentElement.style.setProperty('--section-tint','var(--current-tint)');

  const rows = Object.keys(STANDARD_TIERS).map(id=>({ id, name:STANDARD_TIERS[id].name, isStandard:true }))
    .concat(INSURERS.map(i=>({ id:i.id, name:i.name, isStandard:false })));

  const query = state.tierSearchQuery.trim().toLowerCase();
  const filteredRows = query ? rows.filter(r=>r.name.toLowerCase().includes(query)) : rows;

  const popoverGroup = (label, dotClass, names) => names.length ? `
        <div class="popover-group">
          <div class="popover-label"><span class="popover-dot ${dotClass}"></span>${label}</div>
          <div class="popover-names">${names.join(', ')}</div>
        </div>` : '';

  const typeChip = (status, tierId, section) => {
    if(!status) return '';
    if(status === 'Keine'){
      const { standardNames, customNames } = productTypeBreakdown(tierId, section);
      return `
        <span class="type-chip-wrap">
          <span class="type-chip none">Keine</span>
          <div class="type-chip-popover">
            ${popoverGroup('Keine — customized but zero/disabled', 'none', customNames)}
            ${popoverGroup('Standard', 'standard', standardNames)}
          </div>
        </span>`;
    }
    const { standardNames, customNames } = productTypeBreakdown(tierId, section);
    return `
      <span class="type-chip-wrap">
        <span class="type-chip ${status==='Einzelvereinbarung'?'custom':'standard'}">${status}</span>
        <div class="type-chip-popover">
          ${popoverGroup('Einzelvereinbarung', 'custom', customNames)}
          ${popoverGroup('Standard', 'standard', standardNames)}
        </div>
      </span>`;
  };

  let html = `
    <div class="list-toolbar">
      <div class="input-wrap list-search">
        <input type="text" id="tier-search-input" placeholder="Search Versicherer/Standard…" value="${state.tierSearchQuery}">
      </div>
    </div>
    <table class="tier-table">
      <thead>
        <tr>
          <th>Versicherer/Standard</th>
          <th>Pauschal</th>
          <th>Individual</th>
        </tr>
      </thead>
      <tbody>
        ${filteredRows.map(r=>`
        <tr data-open-tier="${r.id}">
          <td>${r.isStandard ? `
          <div class="name-cell std-summary-wrap">
            ${r.name}
            <span class="std-summary-icon">ⓘ</span>
            <div class="std-summary-popover">
              <div class="popover-title">Product configuration summary</div>
              ${standardTierSummaryHtml(r.id)}
            </div>
          </div>` : `<div class="name-cell">${r.name}</div>`}</td>
          <td>${typeChip(tierSectionStatus(r.id, 'pauschal'), r.id, 'pauschal')}</td>
          <td>${typeChip(tierSectionStatus(r.id, 'individual'), r.id, 'individual')}</td>
        </tr>`).join('')}
        ${!filteredRows.length ? `<tr><td colspan="3" class="checkbox-empty" style="padding:20px 14px;">No results for "${state.tierSearchQuery}".</td></tr>` : ''}
      </tbody>
    </table>
  `;
  document.getElementById('content').innerHTML = html;

  const searchInput = document.getElementById('tier-search-input');
  searchInput.addEventListener('input', e=>{
    state.tierSearchQuery = e.target.value;
    renderTierList();
  });
  searchInput.focus();
  searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);

  document.querySelectorAll('[data-open-tier]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.tierId = el.dataset.openTier;
      state.productId = null;
      state.periodTab = 'current';
      render();
    });
  });
}

/* ===================== RENDER: TIER DETAIL ===================== */
function renderTierDetail(){
  const tierId = state.tierId;
  const isStandard = isStandardTier(tierId);
  const custom = isCustom(tierId);
  document.documentElement.style.setProperty('--section-accent','var(--current)');
  document.documentElement.style.setProperty('--section-tint','var(--current-tint)');

  const standardSub = tierId==='standard'
    ? 'Applies to every insurer unless customized'
    : 'Standalone standard-tier configuration';

  let html = `
    <div class="crumbs">
      <span class="seg" data-crumb-back>Preise Versicherer</span>
      <span class="sep">/</span>
      <span class="seg current">${tierName(tierId)}</span>
      ${(!isStandard && !custom) ? '' : `<span class="sep">/</span><span class="seg current">${state.periodTab==='current'?'Current':(state.periodTab==='future'?'Future planning':'History')}</span>`}
    </div>
    <div class="detail-header">
      <div>
        <h2>${tierName(tierId)} ${tierId==='standard' ? '<span class="tag-default">Default</span>' : ''}</h2>
        <div class="sub">${isStandard ? standardSub : (custom ? 'Custom configuration' : 'Currently inherits Standard Tier pricing')}</div>
      </div>
      <div class="detail-actions">
        ${(!isStandard && custom) ? `<button class="btn danger-ghost small" id="revert-tier-btn">Revert to Standard Tier</button>` : ''}
        <span id="header-save-slot"></span>
      </div>
    </div>
  `;

  if(!isStandard && !custom){
    html += `
      <div class="inherit-callout">
        <div class="icon">⤷</div>
        <h3>${tierName(tierId)} uses Standard Tier pricing</h3>
        <p>No custom rates have been set for this insurer. It automatically follows every change made to the Standard Tier, for both current and future-planned pricing.</p>
        <button class="btn accent small" id="customize-tier-btn">Customize pricing for ${tierName(tierId)}</button>
      </div>
    `;
    document.getElementById('content').innerHTML = html;
    document.querySelector('[data-crumb-back]').addEventListener('click', ()=>{ state.tierId=null; render(); });
    document.getElementById('customize-tier-btn').addEventListener('click', ()=>{
      INSURER_STATE[tierId].custom = true;
      INSURER_STATE[tierId].products = customFromStandard({}, {});
      showToast('Custom pricing enabled — starts as a copy of Standard Tier');
      render();
    });
    return;
  }

  html += `
    <div class="tab-row">
      <button class="tab-btn tab-current ${state.periodTab==='current'?'active':''}" id="tab-current-btn"><span class="tdot"></span> Current</button>
      <button class="tab-btn tab-future ${state.periodTab==='future'?'active':''}" id="tab-future-btn"><span class="tdot"></span> Future planning</button>
      <button class="tab-btn tab-history ${state.periodTab==='history'?'active':''}" id="tab-history-btn"><span class="tdot"></span> History</button>
    </div>
    ${state.periodTab==='current' ? `<div class="hint" style="margin:-10px 0 16px; font-size:10px; color:var(--gray-400);">Pricing configs applied to claims since ${currentPricingSinceDate(tierId)} until now</div>` : ''}`;

  if(state.periodTab === 'history'){
    const tierPeriods = TIER_HISTORY_PERIODS[tierId] || [];
    if(state.historyPeriodIdx >= tierPeriods.length) state.historyPeriodIdx = 0;
    const periodData = tierPeriods.length ? HISTORY_DATA[tierId][state.historyPeriodIdx] : null;
    if(!periodData || !periodData[state.historyProductId]){
      state.historyProductId = periodData ? PRODUCTS[0].id : null;
    }

    const validBanner = tierPeriods.length ? `
        <div class="planned-banner" style="color:var(--history); background:var(--history-tint); border-color:var(--history-line);">
          🔒 Valid period
          <select id="history-period-select">
            ${tierPeriods.map((pr,i)=>`<option value="${i}" ${i===state.historyPeriodIdx?'selected':''}>${pr.validFrom} → ${pr.validTo}</option>`).join('')}
          </select>
          <span style="margin-left:8px; font-family:var(--sans); font-size:11px; color:var(--ink-faint);">applies to every product below</span>
        </div>` : '';

    html += `
      ${validBanner}
      <div class="scope-layout">
        <div class="scope-list">
          <div class="scope-list-header">Products · History</div>
          ${!periodData ? `<div class="checkbox-empty" style="padding:20px 14px;">No historical pricing recorded for ${tierName(tierId)} yet.</div>` : ''}
          ${periodData ? PRODUCTS.map(p=>`
          <div class="scope-item ${state.historyProductId===p.id?'active':''}" data-open-history-product="${p.id}">
            <div class="stitle">${p.name}</div>
          </div>`).join('') : ''}
        </div>
        <div id="history-editor-slot"></div>
      </div>
    `;
    document.getElementById('content').innerHTML = html;
    bindTierNavHandlers(tierId);
    document.querySelectorAll('[data-open-history-product]').forEach(el=>{
      el.addEventListener('click', ()=>{
        state.historyProductId = el.dataset.openHistoryProduct;
        render();
      });
    });
    const historyPeriodSelect = document.getElementById('history-period-select');
    if(historyPeriodSelect){
      historyPeriodSelect.addEventListener('change', e=>{
        state.historyPeriodIdx = Number(e.target.value);
        render();
      });
    }
    renderHistoryEditor(tierId);
    return;
  }

  html += `
    ${state.periodTab==='future' ? `<div class="planned-banner">📅 Planned changes shown below — take effect on <input type="date" id="future-date-input" value="${futureDates[tierId].from}"> · not yet live</div>
    <div class="future-warning">⚠ <span>As soon as the start date above is reached, these configurations will automatically <b>replace</b> the current configurations — no further action is required.</span></div>` : ''}
    <div class="scope-layout">
      <div class="scope-list">
        <div class="scope-list-header">Products · ${state.periodTab==='current'?'Current':'Future planning'}</div>`;
  PRODUCTS.forEach(p=>{
    html += `
        <div class="scope-item ${state.productId===p.id?'active':''}" data-open-product="${p.id}">
          <div class="stitle">${p.name}</div>
        </div>`;
  });
  html += `
      </div>
      <div class="detail-row">
        <div id="editor-slot"></div>
        <div class="cost-ref-panel ${state.costPanelOpen?'':'collapsed'}" id="cost-ref-panel"></div>
      </div>
    </div>
    <div id="tier-actions-bar"></div>
  `;
  document.getElementById('content').innerHTML = html;

  bindTierNavHandlers(tierId);
  const futureDateInput = document.getElementById('future-date-input');
  if(futureDateInput){
    futureDateInput.addEventListener('change', e=>{
      futureDates[tierId].from = e.target.value;
      showToast('Effective date updated');
      render();
    });
  }
  document.querySelectorAll('[data-open-product]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.productId = el.dataset.openProduct;
      render();
    });
  });

  renderEditor();
}

function bindTierNavHandlers(tierId){
  document.querySelector('[data-crumb-back]').addEventListener('click', ()=>{ state.tierId=null; state.productId=null; render(); });
  document.getElementById('tab-current-btn').addEventListener('click', ()=>{ state.periodTab='current'; render(); });
  document.getElementById('tab-future-btn').addEventListener('click', ()=>{ state.periodTab='future'; render(); });
  document.getElementById('tab-history-btn').addEventListener('click', ()=>{ state.periodTab='history'; render(); });
  const revertBtn = document.getElementById('revert-tier-btn');
  if(revertBtn){
    revertBtn.addEventListener('click', ()=>{
      if(!confirm(`Revert ${tierName(tierId)} to Standard Tier pricing? Its custom rates will be discarded.`)) return;
      INSURER_STATE[tierId].custom = false;
      INSURER_STATE[tierId].products = null;
      state.productId = null;
      showToast('Reverted to Standard Tier');
      render();
    });
  }
}

/* ===================== RENDER: PRODUCT EDITOR ===================== */
function renderEditor(){
  const slot = document.getElementById('editor-slot');
  const tierId = state.tierId, productId = state.productId;
  if(!productId){
    slot.innerHTML = `<div class="empty-state">Select a product on the left to view or edit its pricing.</div>`;
    const bar = document.getElementById('tier-actions-bar');
    if(bar) bar.innerHTML = '';
    const saveSlot = document.getElementById('header-save-slot');
    if(saveSlot) saveSlot.innerHTML = '';
    renderCostRefPanel(null);
    return;
  }

  const p = findProduct(productId);
  const products = effectiveProducts(tierId);
  const productEntry = products[productId];
  const period = productEntry[state.periodTab];
  const custom = isCustom(tierId);
  if(!period.pauschal.rangePricing) period.pauschal.rangePricing = { enabled:false, ranges:[] };

  const insurerScoped = !isStandardTier(tierId);
  const stdPeriod = insurerScoped ? standardProducts[productId][state.periodTab] : null;
  const pauschalLocked = insurerScoped && period.pauschal.configType !== 'Einzelvereinbarung';
  const individualLocked = insurerScoped && period.individual.configType !== 'Einzelvereinbarung';

  const pSrc = pauschalLocked ? stdPeriod.pauschal : period.pauschal;
  const iSrc = individualLocked ? stdPeriod.individual : period.individual;
  const rp = pSrc.rangePricing || { enabled:false, ranges:[] };

  const configTypeField = (id, current) => `
            <div class="field span-3">
              <label class="required">Preiskonfigurationstyp</label>
              <select id="${id}" style="max-width:300px;">
                <option value="Standard" ${current!=='Einzelvereinbarung'?'selected':''}>Standard</option>
                <option value="Einzelvereinbarung" ${current==='Einzelvereinbarung'?'selected':''}>Einzelvereinbarung</option>
              </select>
              <div class="hint">Use the predefined Standard configuration, or select <b>Einzelvereinbarung</b> to customize pricing specifically for this insurer.</div>
            </div>`;

  const periodBadge = state.periodTab==='current'
    ? `<span class="tab-btn tab-current active" style="cursor:default;"><span class="tdot"></span> Current</span>`
    : `<span class="tab-btn tab-future active" style="cursor:default;"><span class="tdot"></span> Future planning</span>`;

  slot.innerHTML = `
    <div class="editor">
      <div class="editor-head">
        <div>
          <div class="etitle">${p.name}</div>
          <div class="esub">${p.code} · ${tierName(tierId)}${tierId==='standard' ? ' (default)' : ''}</div>
        </div>
        ${periodBadge}
      </div>

      <div class="editor-body" style="padding-top:22px;">

        <div class="section-block" id="block-pauschal">
          <div class="section-block-head">
            <div class="stitle2"><span class="num">1</span> Pauschal Pricing</div>
            <div class="htag">flat rate</div>
          </div>
          <div class="section-block-body">
            ${insurerScoped ? configTypeField('f-pauschal-configtype', period.pauschal.configType) : ''}
            ${rp.enabled ? `
            <div class="field span-3">
              <label>Price by Erstreserve range</label>
              <div class="range-table" id="range-table">
                ${rp.ranges.map((r,i)=>rangeRowHtml(r,i,rp.ranges.length,pauschalLocked)).join('')}
              </div>
              <div class="range-actions">
                <button class="btn ghost small" id="add-interval-btn" type="button" ${pauschalLocked?'disabled':''}>+ Add interval</button>
              </div>
            </div>` : ''}
            ${!rp.enabled ? `
            <div class="field">
              <label class="required">Price</label>
              <div class="input-wrap">
                <input type="text" id="f-price" value="${pSrc.price}" ${pauschalLocked?'disabled':''}>
                <span class="unit">EUR</span>
              </div>
            </div>` : `<div class="field"><label>&nbsp;</label><div class="input-wrap"></div></div>`}
            <div class="field">
              <label>&nbsp;</label>
              ${!rp.enabled
                ? `<button type="button" class="range-toggle-link" id="add-range-btn" ${pauschalLocked?'disabled':''}>+ Break price into ranges</button>`
                : `<button type="button" class="range-toggle-link" id="remove-ranges-btn" style="color:var(--red-400);" ${pauschalLocked?'disabled':''}>Use single price instead</button>`}
            </div>
            <div class="field span-3">
              <label class="required">Threshold value</label>
              <div class="input-wrap" style="max-width:260px;">
                <input type="text" id="f-threshold" value="${pSrc.threshold}" ${pauschalLocked?'disabled':''}>
                <span class="unit">EUR</span>
              </div>
              <div class="hint">Wenn der höhere Betrag aus Reserve und Forderungshöhe diese Schwelle erreicht, greifen die untenstehenden Individualpreise.</div>
            </div>
          </div>
        </div>

        <div class="section-block" id="block-individual">
          <div class="section-block-head">
            <div class="stitle2"><span class="num">2</span> Individual Pricing</div>
            <div class="htag">usage-based</div>
          </div>
          <div class="section-block-body">
            ${insurerScoped ? configTypeField('f-individual-configtype', period.individual.configType) : ''}
            <div class="field">
              <label class="required">Hour rate</label>
              <div class="input-wrap"><input type="text" id="f-hour" value="${iSrc.hourRate}" ${individualLocked?'disabled':''}><span class="unit">EUR/h</span></div>
            </div>
            <div class="field">
              <label class="required">Km rate</label>
              <div class="input-wrap"><input type="text" id="f-km" value="${iSrc.kmRate}" ${individualLocked?'disabled':''}><span class="unit">EUR/km</span></div>
            </div>
            <div class="field">
              <label class="required">Driving time rate</label>
              <div class="input-wrap"><input type="text" id="f-drive" value="${iSrc.drivingTimeRate}" ${individualLocked?'disabled':''}><span class="unit">EUR/h</span></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  `;

  const actionsBar = document.getElementById('tier-actions-bar');
  if(actionsBar){
    actionsBar.innerHTML = `
      <div class="actions-left">
        <div class="saved-hint">Last updated ${period.updated}${state.periodTab==='future' ? ' · planned for ' + futureDates[tierId].from : ' · live now'}</div>
      </div>
    `;
  }
  const saveSlot = document.getElementById('header-save-slot');
  if(saveSlot) saveSlot.innerHTML = `<button class="btn accent small" id="save-scope-btn">Save changes</button>`;

  renderCostRefPanel(productId);

  // Keep Price/Threshold/Individual rates committed to `period` as the user
  // types, instead of only reading them from the DOM on Save. Without this,
  // any full re-render triggered by an unrelated control (e.g. switching a
  // Preiskonfigurationstyp select, adding a range interval) would rebuild
  // these fields from the last-saved `period` values and silently discard
  // whatever the user had typed but not yet saved.
  if(!pauschalLocked){
    const priceInputLive = document.getElementById('f-price');
    if(priceInputLive) priceInputLive.addEventListener('input', e=>{ period.pauschal.price = e.target.value===''?'':Number(e.target.value)||0; });
    const thresholdInputLive = document.getElementById('f-threshold');
    if(thresholdInputLive) thresholdInputLive.addEventListener('input', e=>{ period.pauschal.threshold = e.target.value===''?'':Number(e.target.value)||0; });
  }
  if(!individualLocked){
    const hourInputLive = document.getElementById('f-hour');
    if(hourInputLive) hourInputLive.addEventListener('input', e=>{ period.individual.hourRate = e.target.value===''?'':Number(e.target.value)||0; });
    const kmInputLive = document.getElementById('f-km');
    if(kmInputLive) kmInputLive.addEventListener('input', e=>{ period.individual.kmRate = e.target.value===''?'':Number(e.target.value)||0; });
    const driveInputLive = document.getElementById('f-drive');
    if(driveInputLive) driveInputLive.addEventListener('input', e=>{ period.individual.drivingTimeRate = e.target.value===''?'':Number(e.target.value)||0; });
  }

  if(insurerScoped){
    document.getElementById('f-pauschal-configtype').addEventListener('change', e=>{
      period.pauschal.configType = e.target.value;
      renderEditor();
    });
    document.getElementById('f-individual-configtype').addEventListener('change', e=>{
      period.individual.configType = e.target.value;
      renderEditor();
    });
  }

  const rangeToggleAddBtn = document.getElementById('add-range-btn');
  if(rangeToggleAddBtn){
    rangeToggleAddBtn.addEventListener('click', ()=>{
      rp.enabled = true;
      // Start with 2 rows instead of 1: a bounded first bracket (carrying over
      // the previous single price) plus the open-ended last bracket, so the
      // user doesn't have to click "+ Add interval" once just to get going.
      rp.ranges = [
        { from:0, to:1000, price: period.pauschal.price || 0 },
        { from:1000, to:'', price: 0 }
      ];
      renderEditor();
    });
  }
  const rangeToggleRemoveBtn = document.getElementById('remove-ranges-btn');
  if(rangeToggleRemoveBtn){
    rangeToggleRemoveBtn.addEventListener('click', ()=>{
      rp.enabled = false;
      renderEditor();
    });
  }
  const addIntervalBtn = document.getElementById('add-interval-btn');
  if(addIntervalBtn){
    addIntervalBtn.addEventListener('click', ()=>{
      // The last row is always the open-ended "higher than" bracket. Adding
      // an interval splits it: a new bounded row takes over where the open
      // bracket used to start, and the open bracket now starts after it.
      const openRow = rp.ranges[rp.ranges.length-1];
      const openFrom = Number(openRow.from) || 0;
      const newTo = openFrom + 1000;
      rp.ranges.splice(rp.ranges.length-1, 0, { from: openFrom, to: newTo, price:0 });
      openRow.from = newTo;
      renderEditor();
    });
  }
  document.querySelectorAll('.range-to-input').forEach(el=>{
    el.addEventListener('input', e=>{
      const idx = Number(el.dataset.idx);
      rp.ranges[idx].to = e.target.value === '' ? '' : Number(e.target.value);
      // Keep the next range's read-only "from" field in sync without a full
      // re-render — replacing the DOM here would steal focus mid-keystroke.
      if(rp.ranges[idx+1]){
        rp.ranges[idx+1].from = rp.ranges[idx].to || 0;
        const nextFromInput = document.querySelector('.range-from-display[data-idx="'+(idx+1)+'"]');
        if(nextFromInput) nextFromInput.value = rp.ranges[idx+1].from;
      }
    });
  });
  document.querySelectorAll('.range-price-input').forEach(el=>{
    el.addEventListener('input', e=>{
      const idx = Number(el.dataset.idx);
      rp.ranges[idx].price = e.target.value === '' ? '' : Number(e.target.value);
    });
  });
  document.querySelectorAll('.range-delete-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = Number(el.dataset.idx);
      rp.ranges.splice(idx,1);
      rp.ranges.forEach((r,i)=>{ r.from = i===0 ? 0 : (rp.ranges[i-1].to || 0); });
      if(rp.ranges.length===0) rp.enabled = false;
      renderEditor();
    });
  });

  function applyAndSaveScope(){
    if(!pauschalLocked){
      const priceInput = document.getElementById('f-price');
      if(priceInput) period.pauschal.price = Number(priceInput.value) || 0;
      period.pauschal.threshold = Number(document.getElementById('f-threshold').value) || 0;
    }
    if(!individualLocked){
      period.individual.hourRate = Number(document.getElementById('f-hour').value) || 0;
      period.individual.kmRate = Number(document.getElementById('f-km').value) || 0;
      period.individual.drivingTimeRate = Number(document.getElementById('f-drive').value) || 0;
    }
    if(insurerScoped){
      period.pauschal.configType = document.getElementById('f-pauschal-configtype').value;
      period.individual.configType = document.getElementById('f-individual-configtype').value;
    }
    period.updated = new Date().toISOString().slice(0,10);
    showToast(state.periodTab === 'future' ? 'Planned change saved' : 'Configuration saved');
    render();
  }

  document.getElementById('save-scope-btn').addEventListener('click', ()=>{
    if(state.periodTab === 'current'){
      openConfirmModal({
        title: 'Save current pricing change?',
        body: `This price change will take effect <b>immediately</b> for every new claim arriving into the system from now on. The previous pricing configuration will remain available under the History tab for consultation.`,
        confirmLabel: 'Save & apply now',
        confirmClass: 'accent',
        onConfirm: applyAndSaveScope,
      });
    } else {
      applyAndSaveScope();
    }
  });

}

/* ===================== RENDER: COST REFERENCE PANEL (read-only) ===================== */
function renderCostRefPanel(productId){
  const panel = document.getElementById('cost-ref-panel');
  if(!panel) return;

  if(!state.costPanelOpen){
    panel.innerHTML = `
      <div class="cost-ref-collapsed-strip" id="cost-ref-expand-btn" title="Show Regulierer / BO cost reference">
        <span class="crs-icon">◂</span>
        <span class="crs-label">Regulierer / BO cost</span>
      </div>`;
    document.getElementById('cost-ref-expand-btn').addEventListener('click', ()=>{
      state.costPanelOpen = true;
      render();
    });
    return;
  }

  if(!productId){
    panel.innerHTML = `
      <div class="cost-ref-card">
        <div class="cost-ref-card-head">
          <h4>Regulierer / BO cost</h4>
          <button class="btn ghost small" id="cost-ref-collapse-btn" type="button">Hide ▸</button>
        </div>
        <div style="padding:16px; font-size:12px; color:var(--ink-faint);">Select a product to see what's paid to Regulierer / BO for it.</div>
      </div>`;
    document.getElementById('cost-ref-collapse-btn').addEventListener('click', ()=>{
      state.costPanelOpen = false;
      render();
    });
    return;
  }

  const providers = COST_REFERENCE[productId] || [];
  if(state.costPanelTab >= providers.length) state.costPanelTab = 0;
  const c = providers[state.costPanelTab];

  const providerSelectHtml = `

  if(removeBreakdownBtn){
    removeBreakdownBtn.addEventListener('click', ()=>{
      GENERAL_CONFIG.invoiceDueBreakdownActive = false;
      renderGeneralConfigs();
    });
  }

  const addOverrideBtn = document.getElementById('add-invoice-override-btn');
  if(addOverrideBtn){
    addOverrideBtn.addEventListener('click', ()=>{
      GENERAL_CONFIG.invoiceDueOverrides.push({ id:'due_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), insurerIds:[], days: GENERAL_CONFIG.invoiceDueDays || 30 });

      document.querySelectorAll('.chip-select.open').forEach(o=>o.classList.remove('open'));
      if(!wasOpen) wrap.classList.add('open');

  if(!window.__chipSelectDocListenerAdded){
    window.__chipSelectDocListenerAdded = true;
    document.addEventListener('click', function(e){
      if(!e.target.closest('.chip-select')){

      const idx = Number(el.dataset.idx);
      const insurerId = el.dataset.insurer;
      const grp = GENERAL_CONFIG.invoiceDueOverrides[idx];
      if(e.target.checked){
        if(!grp.insurerIds.includes(insurerId)) grp.insurerIds.push(insurerId);
      } else {
        grp.insurerIds = grp.insurerIds.filter(id=>id!==insurerId);

      updateChipSelectUI(idx);

  // ---- Extra costs (Rechnung tab) wiring — global by default, with an

      renderGeneralConfigs();

  if(addExtraCostsOverrideBtn){
    addExtraCostsOverrideBtn.addEventListener('click', ()=>{
      GENERAL_CONFIG.extraCostsOverrides.push({ id:'ecgrp_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), insurerIds:[], enabled:false, list:[] });
      renderGeneralConfigs();
    });
  }
  document.querySelectorAll('.ec-override-delete-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = Number(el.dataset.idx);
      GENERAL_CONFIG.extraCostsOverrides.splice(idx,1);
      renderGeneralConfigs();
    });
  });
  // Every extra-cost row/select below can live either in the single default
  // list or inside one of the insurer-group overrides — resolve which one a
  // given element belongs to by walking up to the nearest override group
  // container; falls back to the default/global list when there isn't one.
  function extraCostsListFor(el){
    const groupEl = el.closest('[data-override-idx]');
    if(groupEl) return GENERAL_CONFIG.extraCostsOverrides[Number(groupEl.dataset.overrideIdx)].list;
    return GENERAL_CONFIG.extraCostsList;

      renderGeneralConfigs();

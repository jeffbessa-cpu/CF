      const list = extraCostsListFor(el);
      if(list[idx]) list[idx].art = e.target.value;
      renderGeneralConfigs();
    });
  });
  document.querySelectorAll('.extra-cost-value-input').forEach(el=>{
    el.addEventListener('input', e=>{
      const idx = Number(el.dataset.idx);
      const list = extraCostsListFor(el);
      if(list[idx]) list[idx].value = e.target.value === '' ? '' : Number(e.target.value);
    });
  });
  document.querySelectorAll('.extra-cost-amount-free-input').forEach(el=>{
    el.addEventListener('input', e=>{
      const idx = Number(el.dataset.idx);
      const list = extraCostsListFor(el);
      if(list[idx]) list[idx].amountFree = e.target.value === '' ? '' : Number(e.target.value);
    });
  });
  document.querySelectorAll('.extra-cost-delete-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = Number(el.dataset.idx);
      const list = extraCostsListFor(el);
      list.splice(idx,1);
      renderGeneralConfigs();
    });
  });

  document.querySelectorAll('.ec-chip-option-checkbox').forEach(el=>{
    el.addEventListener('change', e=>{
      const idx = Number(el.dataset.idx);
      const insurerId = el.dataset.insurer;
      const grp = GENERAL_CONFIG.extraCostsOverrides[idx];
      if(e.target.checked){
        // The checkbox is already disabled in the markup when another group
        // has this insurer, but guard here too in case of any DOM staleness.
        const takenElsewhere = GENERAL_CONFIG.extraCostsOverrides.some((g,gi)=>gi!==idx && g.insurerIds.includes(insurerId));
        if(takenElsewhere){
          e.target.checked = false;
          showToast('This insurer is already assigned to another group');
          return;
        }
        if(!grp.insurerIds.includes(insurerId)) grp.insurerIds.push(insurerId);
      } else {
        grp.insurerIds = grp.insurerIds.filter(id=>id!==insurerId);
      }
      // A full re-render is needed on every change here (not just when the
      // group's own empty/non-empty state flips): picking an insurer in this
      // group also has to grey it out in every OTHER group's dropdown, so
      // all groups must be rebuilt, not just this one.
      renderGeneralConfigs();
    });
  });
  wireExtraCostsChipRemoveButtons();
}

function updateChipSelectUI(idx){
  const grp = GENERAL_CONFIG.invoiceDueOverrides[idx];
  const chipsEl = document.getElementById('chip-select-chips-'+idx);
  const countEl = document.getElementById('chip-select-count-'+idx);
  if(chipsEl) chipsEl.innerHTML = grp.insurerIds.map(id=>chipHtml(id,idx)).join('');
  if(countEl) countEl.textContent = `${grp.insurerIds.length} von ${INSURERS.length} ausgewählt`;
  wireChipRemoveButtons();
}

function wireChipRemoveButtons(){
  document.querySelectorAll('.chip-remove').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      const idx = Number(el.dataset.idx);
      const insurerId = el.dataset.insurer;
      const grp = GENERAL_CONFIG.invoiceDueOverrides[idx];
      grp.insurerIds = grp.insurerIds.filter(id=>id!==insurerId);
      const checkbox = document.querySelector(`.chip-option-checkbox[data-idx="${idx}"][data-insurer="${insurerId}"]`);
      if(checkbox) checkbox.checked = false;
      updateChipSelectUI(idx);
    });
  });
}

// Extra costs' own chip-remove wiring — kept separate from
// wireChipRemoveButtons above (invoice due-date overrides) so the two
// features' chip data never cross-update each other. Always triggers a full
// re-render (rather than a lightweight DOM patch) because removing an
// insurer from one group can free it up in every other group's dropdown, and
// removing the group's last insurer collapses its table into the empty state.
function wireExtraCostsChipRemoveButtons(){
  document.querySelectorAll('.ec-chip-remove').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      const idx = Number(el.dataset.idx);
      const insurerId = el.dataset.insurer;
      const grp = GENERAL_CONFIG.extraCostsOverrides[idx];
      grp.insurerIds = grp.insurerIds.filter(id=>id!==insurerId);
      renderGeneralConfigs();
    });
  });
}

/* ===================== ROOT RENDER ===================== */
function render(){
  renderShell();
  if(state.section === 'generalConfigs'){
    renderGeneralConfigs();
  } else if(state.section === 'boFees'){
    if(state.regStdId){
      renderRegStdDetail();
    } else {
      renderBoFeesList();
    }
  } else if(state.section === 'regFees'){
    if(state.regStdId){
      renderRegStdDetail();
    } else {
      renderRegFeesList();
    }
  } else if(state.tierId){
    renderTierDetail();
  } else {
    renderTierList();
  }
}

document.querySelectorAll('.nav-item').forEach(el=>{
  el.addEventListener('click', ()=>{
    state.section = el.dataset.section;
    state.tierId = null;
    state.productId = null;
    render();
  });
});

document.getElementById('clock-date').textContent = 'Today · ' + new Date().toISOString().slice(0,10);

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aufnahmen Vorlagen · Admin — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --orange: #F2660D;
    --orange-dark: #D85608;
    --orange-soft: #FDEDE0;
    --orange-disabled: #F8B287;
    --blue-bg: #DCEAFE;
    --blue-text: #1D57C4;
    --green: #17A34A;
    --ink-900: #16181D;
    --ink-700: #3B3F46;
    --ink-500: #6B7280;
    --ink-400: #9AA1AB;
    --border: #E4E6EA;
    --border-soft: #EDEEF1;
    --page-bg: #F4F5F7;
    --card: #FFFFFF;
    --toggle-off: #D7DAE0;
    --radius: 8px;
    --shadow-sm: 0 1px 2px rgba(16,20,24,.06);
    --shadow-md: 0 6px 20px rgba(16,20,24,.12);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Open Sans', system-ui, -apple-system, sans-serif;
    color:var(--ink-900);
    background:var(--page-bg);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

  /* ===== TOP NAV (shared with the other prototypes) ===== */
  .topnav{
    height:56px;flex:0 0 56px;
    display:flex;align-items:center;
    background:#fff;border-bottom:1px solid var(--border);
    padding:0 18px;gap:22px;
    position:relative;z-index:50;
  }
  .logo{width:32px;height:32px;flex:0 0 auto;display:block;}
  .navtabs{display:flex;align-items:center;gap:22px;height:100%;}
  .navtab{
    position:relative;height:100%;display:flex;align-items:center;gap:4px;
    border:none;background:none;color:var(--ink-500);font-size:14px;font-weight:600;
    padding:0 2px;transition:color .15s;
  }
  .navtab:hover{color:var(--ink-900);}
  .navtab.active{color:var(--ink-900);}
  .navtab.active::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--orange);border-radius:2px 2px 0 0;
  }
  .navtab .chev{width:9px;height:9px;opacity:.6;}
  .navsearch{margin-left:auto;flex:0 1 360px;position:relative;}
  .navsearch input{
    width:100%;height:36px;border-radius:8px;border:1px solid var(--border);
    padding:0 14px 0 36px;font-size:13.5px;background:#F8F9FA;color:var(--ink-900);outline:none;
    transition:border-color .15s, background .15s;
  }
  .navsearch input:focus{border-color:var(--orange);background:#fff;}
  .navsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.45;}
  .navicons{display:flex;align-items:center;gap:6px;margin-left:14px;}
  .navicon-btn{
    width:34px;height:34px;border-radius:8px;border:none;background:none;
    display:flex;align-items:center;justify-content:center;color:var(--ink-500);
    transition:background .15s,color .15s;position:relative;
  }
  .navicon-btn:hover{background:#F1F2F4;color:var(--ink-900);}

  /* dropdown menu shared */
  .dropdown-menu{
    position:absolute;top:calc(100% + 8px);background:#fff;border:1px solid var(--border);
    border-radius:10px;box-shadow:var(--shadow-md);min-width:190px;padding:6px;
    opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .12s,transform .12s,visibility .12s;
    z-index:200;
  }
  .dropdown-menu.open{opacity:1;visibility:visible;transform:translateY(0);}
  .dropdown-menu button{
    width:100%;text-align:left;background:none;border:none;padding:8px 10px;border-radius:6px;
    font-size:13.5px;color:var(--ink-700);display:flex;align-items:center;gap:8px;
  }
  .dropdown-menu button:hover{background:#F5F6F8;color:var(--ink-900);}
  .dropdown-menu .sep{height:1px;background:var(--border-soft);margin:5px 4px;}
  .admin-nav-wrap{position:relative;display:inline-flex;align-items:center;}
  .admin-nav-wrap .chev{width:9px;height:9px;opacity:.75;margin-left:1px;transition:transform .15s;flex:0 0 auto;}
  .admin-nav-wrap:has(.dropdown-menu.open) .chev{transform:rotate(180deg);}

  /* ===== BODY SHELL ===== */
  .body-shell{flex:1;display:flex;min-height:0;}

  /* icon rail */
  .iconrail{
    flex:0 0 52px;background:#fff;border-right:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;padding-top:14px;gap:6px;
  }
  .rail-btn{
    width:36px;height:36px;border-radius:10px;border:none;background:none;color:var(--ink-400);
    display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;
  }
  .rail-btn:hover{background:#F1F2F4;color:var(--ink-700);}
  .rail-btn.active{background:#F1F2F4;color:var(--ink-900);}

  /* buttons */
  .btn{
    height:34px;padding:0 14px;border-radius:7px;font-size:13.5px;font-weight:700;border:1.5px solid transparent;
    display:inline-flex;align-items:center;gap:6px;transition:all .15s;
  }
  .btn-neutral{background:#EAEBEF;color:var(--ink-700);}
  .btn-neutral:hover{background:#E0E2E7;}
  .btn-outline{background:#fff;border-color:var(--orange);color:var(--orange);}
  .btn-outline:hover{background:var(--orange-soft);}
  .btn-solid{background:var(--orange-disabled);color:#fff;cursor:not-allowed;}
  .btn-solid.enabled{background:var(--orange);cursor:pointer;}
  .btn-solid.enabled:hover{background:var(--orange-dark);}
  .btn-peach{background:var(--orange-disabled);color:#7A2E06;}
  .btn-peach:hover{background:#F5A66C;}
  .btn-danger-soft{background:#FBDEDB;color:#B3261E;}
  .btn-danger-soft:hover{background:#F6C9C4;}
  .btn-sm{height:30px;padding:0 12px;font-size:12.5px;}

  /* toast */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink-900);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:600;
    display:flex;align-items:center;gap:10px;opacity:0;visibility:hidden;transition:all .2s;z-index:600;box-shadow:var(--shadow-md);
  }
  .toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);}
  .toast svg{color:var(--green);flex:0 0 auto;}

  /* ===== Aufnahmen Vorlagen (template list) ===== */
  .vl-area{flex:1;overflow-y:auto;min-width:0;background:#fff;}
  .vl-wrap{max-width:1160px;margin:0 auto;padding:26px 28px 70px;}
  .vl-header{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding-bottom:20px;border-bottom:1px solid var(--border-soft);margin-bottom:4px;
  }
  .vl-title{font-size:26px;font-weight:800;color:var(--ink-900);margin:0;}

  /* tabs: switch between the regular Berichte table and the Freitext Berichte table */
  .vl-tabs{display:flex;align-items:center;gap:26px;border-bottom:1px solid var(--border-soft);margin-bottom:22px;}
  .vl-tab{
    position:relative;height:44px;border:none;background:none;color:var(--ink-500);font-size:14px;font-weight:600;
    padding:0 2px;transition:color .15s;
  }
  .vl-tab:hover{color:var(--ink-900);}
  .vl-tab.active{color:var(--ink-900);}
  .vl-tab.active::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--orange);border-radius:2px 2px 0 0;
  }
  .vl-panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;}
  .vl-panel-title{font-size:15px;font-weight:800;color:var(--ink-900);margin:0;}

  /* table */
  .vl-table{width:100%;border-collapse:collapse;}
  .vl-table thead th{
    text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-500);text-transform:uppercase;letter-spacing:.03em;
    padding:0 4px 10px;border-bottom:1px solid var(--border-soft);
  }
  .vl-table thead th.vl-col-actions{text-align:right;}
  .vl-table tbody tr{border-bottom:1px solid var(--border-soft);}
  .vl-table tbody tr:last-child{border-bottom:none;}
  .vl-table tbody tr.is-disabled{opacity:.5;}
  .vl-table td{padding:14px 4px;vertical-align:middle;}
  .vl-name{font-size:14.5px;font-weight:700;color:var(--ink-900);}
  .vl-tags{display:flex;gap:8px;flex-wrap:wrap;}
  .vl-tag{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:20px;background:#EAEBEF;color:var(--ink-700);white-space:nowrap;}
  .vl-actions{display:flex;gap:8px;justify-content:flex-end;}

  .vl-empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:70px 20px;color:var(--ink-400);font-size:13.5px;gap:12px;
  }
</style>
</head>
<body>

<div class="app">

  <header class="topnav">
    <svg class="logo" width="32" height="32" viewBox="67 9 66 66" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Logo">
      <path d="M100.561 64.8853C113.716 64.8853 124.38 54.2416 124.38 41.1119C124.38 27.9822 113.716 17.3385 100.561 17.3385C87.4069 17.3385 76.743 27.9822 76.743 41.1119C76.743 54.2416 87.4069 64.8853 100.561 64.8853Z" fill="white"/>
      <path d="M99.9347 10.4567C82.7424 10.4567 68.7736 24.399 68.7736 41.6482C68.7736 58.8079 82.7424 72.7502 100.024 72.7502C117.306 72.7502 131.185 58.8079 131.185 41.5588C131.096 24.399 117.127 10.4567 99.9347 10.4567ZM113.456 41.9163C113.456 45.7594 111.128 47.4575 105.307 48.2618L95.4575 49.5131C90.264 50.1387 89.6372 51.4793 89.6372 52.8199C89.6372 54.2499 90.264 55.5905 94.4725 55.5905H113.187V58.8973H94.2039C88.9209 58.8973 86.4136 56.9311 86.4136 52.9093V52.6411C86.4136 49.0662 88.9209 47.1 94.383 46.385L104.501 45.1338C109.337 44.5081 110.322 43.3463 110.322 41.7375C110.322 40.1288 109.337 38.967 104.501 38.3413L94.383 36.9114C88.8313 36.1964 86.4136 34.2301 86.4136 30.6552V30.3871C86.4136 26.3653 88.9209 24.399 94.2039 24.399H113.187V27.7059H94.4725C90.1745 27.7059 89.6372 29.0465 89.6372 30.5658C89.6372 31.8171 90.3535 33.247 95.4575 33.8727L105.307 35.2133C111.217 36.0176 113.456 37.8051 113.456 41.5588V41.9163Z" fill="#FF9933"/>
    </svg>
    <nav class="navtabs" id="navtabs">
      <button class="navtab" data-tab="schaden">Schäden</button>
      <button class="navtab" data-tab="aufgaben">Aufgaben</button>
      <button class="navtab" id="backofficeBtn" data-tab="backoffice">Backoffice
        <svg class="chev" width="9" height="9" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="dropdown-menu" id="backofficeMenu">
        <button>📁 Dokumentenvorlagen</button>

        <div class="sep"></div>
        <button>📊 Berichte</button>
      </div>
      <button class="navtab" data-tab="regulierer">Regulierer</button>
      <button class="navtab" data-tab="analytics">Analytics</button>
      <button class="navtab" data-tab="eingang">Eingang</button>
    </nav>
    <div class="navsearch">
      <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6.2" stroke="currentColor" stroke-width="1.6"/><path d="M14 14l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input type="text" placeholder="Vorlagen durchsuchen" id="vlSearchInput">
    </div>
    <div class="admin-nav-wrap">
      <button class="btn btn-neutral" id="adminNavBtn" title="Admin">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3.5v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9v-5L12 3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        Admin
        <svg class="chev" width="9" height="9" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="dropdown-menu" id="adminNavMenu" style="right:0;left:auto;">
        <button data-href="vorlagen-liste-prototype.html">📁 Aufnahmen Vorlagen</button>
        <button data-href="general-configs-prototype.html">⚙️ General Configs</button>
      </div>
    </div>
    <div class="navicons">
      <button class="navicon-btn" title="Hilfe" id="helpBtn">

      </button>
      <button class="navicon-btn" title="Nachrichten" id="chatBtn">

      </button>
      <button class="navicon-btn" title="Einstellungen" id="settingsBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.55 1.55M7.15 16.85L5.6 18.4M18.4 18.4l-1.55-1.55M7.15 7.15L5.6 5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button class="navicon-btn" title="Abmelden" id="logoutBtn">

      </button>
    </div>
  </header>

  <div class="body-shell">

    <!-- LEFT ICON RAIL -->
    <aside class="iconrail" id="iconrail">
      <button class="rail-btn" data-rail="clip" title="Bewertung">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="6" y="4" width="12" height="17" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="9" y="2.3" width="6" height="3.4" rx="1" fill="currentColor"/></svg>

      <button class="rail-btn" data-rail="grid" title="Übersicht">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button class="rail-btn active" data-rail="folder" title="Dokumentenvorlagen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3.5 6.5a1.5 1.5 0 011.5-1.5h4l2 2.2H19a1.5 1.5 0 011.5 1.5v8.8a1.5 1.5 0 01-1.5 1.5H5a1.5 1.5 0 01-1.5-1.5V6.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <button class="rail-btn" data-rail="mail" title="Posteingang">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5.5" width="17" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 7l7.5 6 7.5-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </aside>

    <!-- TEMPLATE LIST AREA -->
    <main class="vl-area">
      <div class="vl-wrap">

        <div class="vl-header">
          <h1 class="vl-title">Aufnahmen Vorlagen</h1>
        </div>

        <div class="vl-tabs" id="vlTabs">
          <button class="vl-tab active" data-vltab="bericht">Berichte</button>

        <!-- BERICHTE -->

<div class="toast" id="toast">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="currentColor" opacity=".15"/><path d="M7 12.5l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span id="toastText">Gespeichert</span>
</div>

<script>
(function(){
  function toast(msg){
    const t=document.getElementById('toast');
    document.getElementById('toastText').textContent=msg;
    t.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer=setTimeout(()=>t.classList.remove('show'), 2200);
  }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function closeAllDropdowns(except){
    document.querySelectorAll('.dropdown-menu.open').forEach(m=>{ if(m!==except) m.classList.remove('open'); });
  }
  document.getElementById('backofficeBtn').addEventListener('click', function(e){
    e.stopPropagation();
    const menu=document.getElementById('backofficeMenu');
    const willOpen=!menu.classList.contains('open');
    closeAllDropdowns();
    if(willOpen) menu.classList.add('open');
  });
  document.addEventListener('click', function(e){
    if(!e.target.closest('.dropdown-menu') && !e.target.closest('#backofficeBtn')){
      closeAllDropdowns();
    }
  });
  document.getElementById('adminNavBtn').addEventListener('click', function(e){
    e.stopPropagation();
    const menu=document.getElementById('adminNavMenu');
    const willOpen=!menu.classList.contains('open');
    closeAllDropdowns();
    if(willOpen) menu.classList.add('open');
  });
  document.getElementById('adminNavMenu').addEventListener('click', function(e){
    const btn=e.target.closest('button[data-href]');
    if(!btn) return;
    const href=btn.dataset.href;
    if(href===location.pathname.split('/').pop()){
      toast('Sie befinden sich bereits auf dieser Seite');
      closeAllDropdowns();
      return;
    }
    window.location.href=href;
  });

  // ---- template data ----
  // type: 'bericht' = regular report template, 'freitext' = free-text report
  // template — each gets its own table/tab further down.
  let tplIdSeq=1;
  const templatesData=[
    {id:'t'+(tplIdSeq++), name:'AllFields', tags:[], type:'bericht', active:true},
    {id:'t'+(tplIdSeq++), name:'Crawford GTS', tags:[], type:'bericht', active:true},
    {id:'t'+(tplIdSeq++), name:'Crawford Haft', tags:['Haft','KFZ','Sach'], type:'bericht', active:true},
    {id:'t'+(tplIdSeq++), name:'Sach', tags:['Sach','KFZ'], type:'bericht', active:true},
    {id:'t'+(tplIdSeq++), name:'Feuerschaden', tags:['Sach'], type:'bericht', active:true},
    {id:'t'+(tplIdSeq++), name:'Wasserschaden', tags:['Sach'], type:'bericht', active:true},
    {id:'t'+(tplIdSeq++), name:'Brandschaden Freitext', tags:['Sach'], type:'freitext', active:true},
    {id:'t'+(tplIdSeq++), name:'Wasserschaden Freitext', tags:['Sach'], type:'freitext', active:true},
    {id:'t'+(tplIdSeq++), name:'Einbruchdiebstahl Freitext', tags:['Sach','Haft'], type:'freitext', active:true}
  ];

  const TABLES={
    bericht:{list:document.getElementById('vlBerichtList'), empty:document.getElementById('vlBerichtEmpty')},
    freitext:{list:document.getElementById('vlFreitextList'), empty:document.getElementById('vlFreitextEmpty')}
  };

  function rowsHtml(rows){
    return rows.map(t=>`
      <tr class="${t.active?'':'is-disabled'}" data-id="${t.id}">
        <td class="vl-name">${escapeHtml(t.name)}</td>
        <td><div class="vl-tags">${t.tags.map(tag=>`<span class="vl-tag">${escapeHtml(tag)}</span>`).join('')}</div></td>
        <td>
          <div class="vl-actions">
            <button class="btn btn-neutral btn-sm" data-edit="${t.id}">Bearbeiten</button>
            <button class="btn btn-neutral btn-sm" data-recordings="${t.id}">Aufnahmen</button>
            <button class="btn btn-danger-soft btn-sm" data-toggle="${t.id}">${t.active?'Deaktivieren':'Aktivieren'}</button>
          </div>
        </td>
      </tr>`).join('');
  }
  function renderTable(type, filter){
    const q=(filter||'').trim().toLowerCase();
    const rows=templatesData.filter(t=>t.type===type && (!q || t.name.toLowerCase().includes(q)));
    const {list, empty}=TABLES[type];
    if(!rows.length){
      list.innerHTML='';
      empty.hidden=false;
      return;
    }
    empty.hidden=true;
    list.innerHTML=rowsHtml(rows);
  }
  function renderAll(filter){
    renderTable('bericht', filter);
    renderTable('freitext', filter);
  }
  renderAll('');

  document.getElementById('vlSearchInput').addEventListener('input', function(){
    renderAll(this.value);
  });

  function handleRowClick(e){
    const editBtn=e.target.closest('[data-edit]');
    if(editBtn){
      const t=templatesData.find(x=>x.id===editBtn.dataset.edit);
      window.location.href='vorlage-bearbeiten-prototype.html?name='+encodeURIComponent(t.name);
      return;
    }
    const recBtn=e.target.closest('[data-recordings]');
    if(recBtn){
      const t=templatesData.find(x=>x.id===recBtn.dataset.recordings);
      toast('Aufnahmen für „'+t.name+'“ sind in diesem Prototyp noch nicht verfügbar');
      return;
    }
    const toggleBtn=e.target.closest('[data-toggle]');
    if(toggleBtn){
      const t=templatesData.find(x=>x.id===toggleBtn.dataset.toggle);
      t.active=!t.active;
      renderTable(t.type, document.getElementById('vlSearchInput').value);
      toast(t.active ? '✓ Vorlage „'+t.name+'“ aktiviert' : 'Vorlage „'+t.name+'“ deaktiviert');
      return;
    }
  }
  document.getElementById('vlBerichtList').addEventListener('click', handleRowClick);
  document.getElementById('vlFreitextList').addEventListener('click', handleRowClick);

  // ---- tabs: Berichte / Freitext Berichte ----
  document.getElementById('vlTabs').addEventListener('click', function(e){
    const tab=e.target.closest('.vl-tab');
    if(!tab) return;
    const target=tab.dataset.vltab;
    document.querySelectorAll('.vl-tab').forEach(t=>t.classList.toggle('active', t===tab));
    document.querySelectorAll('.vl-panel').forEach(p=>{ p.hidden = p.dataset.vlpanel!==target; });
  });

  // ---- each table has its own independent "create new" entry point ----
  document.getElementById('vlNewBerichtBtn').addEventListener('click', function(){
    window.location.href='vorlage-bearbeiten-prototype.html?new=1';
  });
  document.getElementById('vlNewFreitextBtn').addEventListener('click', function(){
    window.location.href='vorlage-bearbeiten-prototype.html?new=1&type=freitext';
  });

})();
</script>
</body>
</html>
